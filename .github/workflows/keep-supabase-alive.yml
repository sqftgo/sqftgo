# Supabase Free pauses a project after 7 days with no database activity.
# https://supabase.com/pricing — "Free projects are paused after 1 week of inactivity."
# This hits production once a day, well before that window. One failed day is still safe.
name: Keep Supabase awake

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          code=$(curl -sS -o /tmp/health.json -w "%{http_code}" --max-time 30 "https://www.sqftgo.com/api/health")
          cat /tmp/health.json
          echo
          test "$code" = "200"
